name: Publish Null Protocol

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-null-protocol
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install RBXL validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r Builder/requirements.txt
      - name: Verify release and publish the place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          import urllib.error
          import urllib.request

          manifest = json.loads(Path('manifest.json').read_text())
          protocol = json.loads(Path('config/protocol.json').read_text())
          if (manifest['buildId'] != protocol['buildId'] or
                  manifest['protocolVersion'] != protocol['version']):
              raise SystemExit('Release build/protocol mismatch; rebuild before publishing.')
          for name, entry in manifest['files'].items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'Missing release file: {name}')
              raw = path.read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit(f'Release checksum mismatch: {name}')
          place = Path('server/funcombat_server.rbxl')
          if place.as_posix() not in manifest['files']:
              raise SystemExit('Server place is missing from the release manifest.')
          payload = place.read_bytes()
          if not payload.startswith(b'<roblox!\x89\xff\r\n\x1a\n'):
              raise SystemExit('The server place is not a binary RBXL file.')
          sys.path.insert(0, str(Path('tools/outfits').resolve()))
          from model_io import validate_saved_scalar_types, validate_place_services
          try:
              validate_saved_scalar_types(place)
              validate_place_services(place)
          except ValueError as error:
              raise SystemExit(str(error)) from None
          key = os.environ.get('ROBLOX_API_KEY', '').strip()
          if not key:
              raise SystemExit('Add ROBLOX_API_KEY in repository Settings > Secrets and variables > Actions.')
          if any(ord(char) < 33 or ord(char) > 126 for char in key):
              raise SystemExit('ROBLOX_API_KEY contains invalid characters; copy the key again.')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None

          url = 'https://apis.roblox.com/universes/v1/10767751574/places/80093785985728/versions?versionType=Published'
          request = urllib.request.Request(url, data=payload, method='POST', headers={
              'x-api-key': key,
              'Content-Type': 'application/octet-stream',
          })
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=120) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Roblox rejected publication (HTTP {error.code}). Check key permissions, expiry and allowed IPs.') from None
          except (urllib.error.URLError, TimeoutError, OSError, ValueError):
              raise SystemExit('Publication status is unknown. Check Roblox version history before retrying.') from None
          version = result.get('versionNumber') if isinstance(result, dict) else None
          if type(version) is not int or version < 1:
              raise SystemExit('Roblox did not confirm a version number. Check version history before retrying.')
          message = f'Published Null Protocol version {version} (build {manifest["buildId"]}).'
          print(message)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with Path(summary).open('a') as output:
                  output.write(message + '\n\n[Open game](https://www.roblox.com/games/80093785985728/)\n')
          PY
